[project]
name = "kb"
version = "0.1.0"
description = "Self-hosted hybrid-search knowledge base: API, ingestion workers, MCP server and CLI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "psycopg[binary]>=3.3",
  "psycopg-pool>=3.3",
  "pydantic>=2.14",
  "pydantic-settings>=2.16",
  "httpx>=0.28",
  "anthropic>=1.15",
  "orjson>=3.13",
  "structlog>=26.1",
  "sse-starlette>=3.5",
  "typer>=0.27",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Rich document parsing (PDF/Office/HTML -> Markdown). Optional so the core stays light.
parsing = ["markitdown[pdf,docx,pptx,xlsx]>=0.1.8"]

[project.scripts]
kb = "kb.cli.main:app"
kb-api = "kb.api.server:main"
kb-worker = "kb.ingest.worker:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
  "pyright>=1.1.414",
  "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
