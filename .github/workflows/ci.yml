name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, pyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: paradedb/paradedb:0.26.2-pg18
        env:
          POSTGRES_USER: kb
          POSTGRES_PASSWORD: kb
          POSTGRES_DB: kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb -d kb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      KB_TEST_DATABASE_URL: postgresql://kb:kb@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Ruff lint
        run: uv run ruff check --output-format=github src tests
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest -q

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4   # version from package.json "packageManager"
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm build

  docker:
    name: Docker image + deploy config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Lint operator scripts
        run: shellcheck -x scripts/*.sh
      - name: Validate launchd plists
        run: python3 -c 'import glob, plistlib; [plistlib.load(open(p, "rb")) for p in glob.glob("deploy/launchd/*.plist")]'
      - name: Validate compose file
        run: docker compose --profile backup config --quiet
      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: kb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
